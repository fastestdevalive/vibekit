name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tier-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Deterministic lint (Tier A)
        run: bash skills/sdlc/evals/lint.sh
      - name: Prose linter
        run: python3 skills/sdlc/evals/prose-lint.py
